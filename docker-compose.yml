# Pile complète Sentinel-X : SEUL docker-compose du projet. Les dépôts enfants (services/)
# ne contiennent que des Dockerfile et de la configuration, montée ou construite ici.
#
#   make init      # sous-modules + .env
#   make certs     # PKI de Baptiste (secrets/) ou certificats de DEV
#   make users     # comptes MQTT hashés depuis .env
#   make up
#   make sim       # données simulées (MQTT_SIMULATOR_PASSWORD requis)
#
# MQTT (TLS + compte + ACL) : seul le service de détection écoute le broker.
#   sentinelx/{device_id}/telemetry  ESP          → détection
#   sentinelx/{device_id}/camera     IA vision    → détection
#   sentinelx/{device_id}/alert      ESP          → détection
#   sentinelx/{device_id}/detection  détection    → (publié, informatif)
# Base unique (services/database, réseau sentinel-data) : la détection écrit alertes et
# états d'appareils, backend-api les lit et les relaie au dashboard (LISTEN/NOTIFY → WebSocket).
#
# Ports publiés UNIQUEMENT sur ${BIND_IP} (192.168.40.1 en prod) :
#   443/80 -> reverse proxy (dashboard + API)     8883 -> Mosquitto (MQTTS)

name: sentinel-x

x-logging: &logging           # MCO : logs plafonnés (3 x 10 Mo par conteneur)
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  logging: *logging

x-mqtt-ca: &mqtt-ca ./services/infrastructure/mosquitto/certs/ca.crt:/certs/ca.crt:ro

services:
  # --- services/infrastructure : point d'entrée HTTP(S) unique ----------------------
  sentinel-reverse-proxy:
    image: nginx:1.27-alpine
    container_name: sentinel-reverse-proxy
    <<: *hardening
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, CHOWN, SETUID, SETGID]
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    ports:
      - "${BIND_IP:-127.0.0.1}:443:443"
      - "${BIND_IP:-127.0.0.1}:80:80"          # redirige seulement vers 443
    volumes:
      - ./services/infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./services/infrastructure/nginx/certs:/etc/nginx/certs:ro
    networks: [sentinel-front]

  # --- services/infrastructure : broker MQTT (TLS 8883 uniquement) -------------------
  sentinel-mosquitto:
    image: eclipse-mosquitto:2
    container_name: sentinel-mosquitto
    <<: *hardening
    user: "1883:1883"                          # non-root
    cap_drop: [ALL]
    read_only: true
    ports:
      - "${BIND_IP:-127.0.0.1}:8883:8883"
    volumes:
      - ./services/infrastructure/mosquitto/config:/mosquitto/config:ro
      - ./services/infrastructure/mosquitto/certs:/mosquitto/certs:ro
      - mosquitto-data:/mosquitto/data
    networks:
      sentinel-back:
        # Le certificat du broker est émis pour mqtt.sentinel.lan : les conteneurs s'y
        # connectent sous ce nom pour que la vérification TLS du nom d'hôte passe.
        aliases: [mqtt.sentinel.lan]

  # --- services/database : base de données unique (jamais exposée) ----------------
  db:
    build: ./services/database
    image: sentinel-x/database:dev
    container_name: g4-db
    <<: *hardening
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB manquant dans .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER manquant dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks: [sentinel-data]

  # --- services/backend-api : REST + WebSocket, derrière le reverse proxy --------
  # Ne parle pas à MQTT : lit la base (alertes, états) et écoute ses NOTIFY.
  sentinel-backend:
    build: ./services/backend-api
    image: sentinel-x/backend-api:dev
    container_name: sentinel-backend
    <<: *hardening
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 5678                       # port attendu par infra/nginx/nginx.conf
      FRONTEND_URL: ${FRONTEND_URL:-https://dashboard.sentinel.lan}
      API_KEY: ${BACKEND_API_KEY:?BACKEND_API_KEY manquant dans .env (make backend-api-key)}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db: { condition: service_healthy }
    networks: [sentinel-front, sentinel-data]

  # --- services/backend-iot-alerts : détection temps réel ---------------------
  detection-service:
    build:
      context: ./services/backend-iot-alerts/detection-service
      args:
        INSTALL_ORANGE: ${INSTALL_ORANGE:-false}
    image: sentinel-x/detection-service:dev
    container_name: sentinel-detection
    <<: *hardening
    environment:
      MQTT_HOST: mqtt.sentinel.lan
      MQTT_PORT: 8883
      MQTT_TLS: "true"
      MQTT_TLS_CA_CERTS: /certs/ca.crt
      MQTT_USERNAME: detection
      MQTT_PASSWORD: ${MQTT_DETECTION_PASSWORD}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PREDICTOR: ${PREDICTOR:-rules}
      WARMUP_SECONDS: ${WARMUP_SECONDS:-120}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - *mqtt-ca
      - ./services/backend-iot-alerts/detection-service/models:/models:ro
    ports:
      - "127.0.0.1:${DETECTION_API_PORT:-8000}:8000"   # API d'admin/debug : jamais exposée hors de la machine
    depends_on:
      sentinel-mosquitto: { condition: service_started }
      db: { condition: service_healthy }
    networks: [sentinel-back, sentinel-data]

  simulator:
    image: sentinel-x/detection-service:dev
    profiles: ["sim"]
    command:
      - python
      - tools/simulator.py
      - --host=mqtt.sentinel.lan
      - --port=8883
      - --tls-ca=/certs/ca.crt
      - --username=simulator
      - --password=${MQTT_SIMULATOR_PASSWORD:-}
      - --device=${SIM_DEVICE:-esp01}
      - --sequence=${SIM_SEQUENCE:-normal:150,presence:30,normal:30,fuite_gaz:45,normal:60,feu:120,capteur_muet:20}
    volumes:
      - *mqtt-ca
    networks: [sentinel-back]
    depends_on: [sentinel-mosquitto]
    healthcheck:
      disable: true

  # --- services/human-detection-ia : IA vision ---------------------------------
  # Analyse le flux MJPEG de la webcam USB (host/capture.py, lancé sur l'hôte : `make
  # capture` dans le sous-module) et publie {"ts", "person"} sur
  # sentinelx/{CAMERA_DEVICE_ID}/camera avec le compte MQTT « vision ».
  human-detection:
    build:
      context: ./services/human-detection-ia/detector
      args:
        YOLO_MODEL: ${YOLO_MODEL:-yolo11n.pt}
    image: sentinel-x/human-detection:dev
    container_name: sentinel-human-detection
    <<: *hardening
    init: true
    environment:
      STREAM_URL: ${CAMERA_STREAM_URL:-http://host.docker.internal:8088/stream}
      YOLO_CONF: ${YOLO_CONF:-0.35}
      MQTT_HOST: mqtt.sentinel.lan
      MQTT_PORT: 8883
      MQTT_USERNAME: vision
      MQTT_PASSWORD: ${MQTT_VISION_PASSWORD}
      MQTT_CA: /certs/ca.crt
      MQTT_DEVICE_ID: ${CAMERA_DEVICE_ID:-esp01}   # même device_id que l'ESP de la pièce
    volumes:
      - *mqtt-ca
    ports:
      - "127.0.0.1:${CAMERA_PREVIEW_PORT:-8089}:8089"   # flux annoté (debug)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          cpus: "4"
    depends_on:
      sentinel-mosquitto: { condition: service_started }
    networks: [sentinel-back]

networks:
  sentinel-front:                # proxy <-> backend/frontend
    driver: bridge
  sentinel-back:                 # services <-> mosquitto
    driver: bridge
  sentinel-data:                 # services <-> base : aucun accès extérieur
    driver: bridge
    internal: true

volumes:
  mosquitto-data: {}
  pg-data: {}                    # données de database (volume existant conservé)
