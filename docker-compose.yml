# Pile complète Sentinel-X : SEUL docker-compose du projet. Les dépôts enfants (services/)
# ne contiennent que des Dockerfile et de la configuration, montée ou construite ici.
#
#   make init      # sous-modules + .env
#   make certs     # PKI de Baptiste (secrets/) ou certificats de DEV
#   make users     # comptes MQTT hashés depuis .env
#   make up
#   make sim       # données simulées (MQTT_SIMULATOR_PASSWORD requis)
#
# MQTT (TLS + compte + ACL) : seul le service de détection écoute le broker.
#   sentinelx/{device_id}/telemetry  ESP          → détection
#   sentinelx/{device_id}/camera     IA vision    → détection (person + identité faciale)
#   sentinelx/{device_id}/alert      ESP          → détection
#   sentinelx/{device_id}/detection  détection    → (publié, informatif)
# Base unique (services/database, réseau sentinel-data) : la détection écrit alertes et
# états d'appareils, backend-api les lit et les relaie au dashboard (LISTEN/NOTIFY → WebSocket).
#
# Ports publiés UNIQUEMENT sur ${BIND_IP} (192.168.40.1 en prod) :
#   443/80 -> reverse proxy (dashboard + API)     8883 -> Mosquitto (MQTTS)
# Grafana : ${GRAFANA_BIND_IP}:${GRAFANA_PORT} (127.0.0.1:3000 par défaut).

name: sentinel-x

x-logging: &logging           # MCO : logs plafonnés (3 x 10 Mo par conteneur)
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  logging: *logging

x-mqtt-ca: &mqtt-ca ./services/infrastructure/mosquitto/certs/ca.crt:/certs/ca.crt:ro

services:
  # --- services/infrastructure : point d'entrée HTTP(S) unique ----------------------
  sentinel-reverse-proxy:
    image: nginx:1.27-alpine
    container_name: sentinel-reverse-proxy
    <<: *hardening
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, CHOWN, SETUID, SETGID]
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    ports:
      - "${BIND_IP:-127.0.0.1}:443:443"
      - "${BIND_IP:-127.0.0.1}:80:80"          # redirige seulement vers 443
    volumes:
      - ./services/infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./services/infrastructure/nginx/certs:/etc/nginx/certs:ro
    networks: [sentinel-front]

  # --- services/infrastructure : broker MQTT (TLS 8883 uniquement) -------------------
  sentinel-mosquitto:
    image: eclipse-mosquitto:2
    container_name: sentinel-mosquitto
    <<: *hardening
    user: "1883:1883"                          # non-root
    cap_drop: [ALL]
    read_only: true
    ports:
      - "${BIND_IP:-127.0.0.1}:8883:8883"
    volumes:
      - ./services/infrastructure/mosquitto/config:/mosquitto/config:ro
      - ./services/infrastructure/mosquitto/certs:/mosquitto/certs:ro
      - mosquitto-data:/mosquitto/data
    networks:
      sentinel-back:
        # Le certificat du broker est émis pour mqtt.sentinel.lan : les conteneurs s'y
        # connectent sous ce nom pour que la vérification TLS du nom d'hôte passe.
        aliases: [mqtt.sentinel.lan]

  # --- services/database : base de données unique (jamais exposée) ----------------
  db:
    build: ./services/database
    image: sentinel-x/database:dev
    container_name: g4-db
    <<: *hardening
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB manquant dans .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER manquant dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks: [sentinel-data]

  # --- services/backend-api : REST + WebSocket, derrière le reverse proxy --------
  # Ne parle pas à MQTT : lit la base (alertes, états) et écoute ses NOTIFY.
  sentinel-backend:
    build: ./services/backend-api
    image: sentinel-x/backend-api:dev
    container_name: sentinel-backend
    <<: *hardening
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 5678                       # port attendu par infra/nginx/nginx.conf
      FRONTEND_URL: ${FRONTEND_URL:-https://dashboard.sentinel.lan}
      API_KEY: ${BACKEND_API_KEY:?BACKEND_API_KEY manquant dans .env (make backend-api-key)}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Visages autorisés et identité caméra : relayés vers l'API interne du détecteur
      VISION_API_URL: http://sentinel-human-detection:8090
      VISION_API_KEY: ${VISION_API_KEY:?VISION_API_KEY manquant dans .env (make vision-api-key)}
    depends_on:
      db: { condition: service_healthy }
    networks: [sentinel-front, sentinel-data, sentinel-vision]

  # --- services/frontend-dashboard : React (statique, nginx), derrière le reverse proxy
  sentinel-frontend:
    build: ./services/frontend-dashboard
    image: sentinel-x/frontend-dashboard:dev
    container_name: sentinel-frontend
    <<: *hardening
    networks: [sentinel-front]

  # --- services/backend-iot-alerts : détection temps réel ---------------------
  detection-service:
    build:
      context: ./services/backend-iot-alerts/detection-service
      args:
        INSTALL_ORANGE: ${INSTALL_ORANGE:-false}
    image: sentinel-x/detection-service:dev
    container_name: sentinel-detection
    <<: *hardening
    environment:
      MQTT_HOST: mqtt.sentinel.lan
      MQTT_PORT: 8883
      MQTT_TLS: "true"
      MQTT_TLS_CA_CERTS: /certs/ca.crt
      MQTT_USERNAME: detection
      MQTT_PASSWORD: ${MQTT_DETECTION_PASSWORD}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PREDICTOR: ${PREDICTOR:-rules}
      WARMUP_SECONDS: ${WARMUP_SECONDS:-120}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - *mqtt-ca
      - ./services/backend-iot-alerts/detection-service/models:/models:ro
    ports:
      - "127.0.0.1:${DETECTION_API_PORT:-8000}:8000"   # API d'admin/debug : jamais exposée hors de la machine
    depends_on:
      sentinel-mosquitto: { condition: service_started }
      db: { condition: service_healthy }
    networks: [sentinel-back, sentinel-data]

  simulator:
    image: sentinel-x/detection-service:dev
    profiles: ["sim"]
    command:
      - python
      - tools/simulator.py
      - --host=mqtt.sentinel.lan
      - --port=8883
      - --tls-ca=/certs/ca.crt
      - --username=simulator
      - --password=${MQTT_SIMULATOR_PASSWORD:-}
      - --device=${SIM_DEVICE:-esp01}
      - --sequence=${SIM_SEQUENCE:-normal:150,presence:30,normal:30,fuite_gaz:45,normal:60,feu:120,capteur_muet:20}
    volumes:
      - *mqtt-ca
    networks: [sentinel-back]
    depends_on: [sentinel-mosquitto]
    healthcheck:
      disable: true

  # --- services/human-detection-ia : IA vision ---------------------------------
  # Analyse le flux MJPEG de la webcam USB (host/capture.py, lancé sur l'hôte : `make
  # capture` dans le sous-module), reconnaît les visages autorisés et publie
  # {"ts", "person", "identity", "names"} sur sentinelx/{CAMERA_DEVICE_ID}/camera avec le
  # compte MQTT « vision ». API interne des visages (8090) : backend-api uniquement.
  human-detection:
    build:
      context: ./services/human-detection-ia/detector
      args:
        YOLO_MODEL: ${YOLO_MODEL:-yolo11n.pt}
    image: sentinel-x/human-detection:dev
    container_name: sentinel-human-detection
    <<: *hardening
    init: true
    environment:
      STREAM_URL: ${CAMERA_STREAM_URL:-http://host.docker.internal:8088/stream}
      YOLO_CONF: ${YOLO_CONF:-0.35}
      MQTT_HOST: mqtt.sentinel.lan
      MQTT_PORT: 8883
      MQTT_USERNAME: vision
      MQTT_PASSWORD: ${MQTT_VISION_PASSWORD}
      MQTT_CA: /certs/ca.crt
      MQTT_DEVICE_ID: ${CAMERA_DEVICE_ID:-esp01}   # même device_id que l'ESP de la pièce
      VISION_API_KEY: ${VISION_API_KEY:?VISION_API_KEY manquant dans .env (make vision-api-key)}
      FACE_MATCH_THRESHOLD: ${FACE_MATCH_THRESHOLD:-0.363}
    volumes:
      - *mqtt-ca
      - faces-data:/data                 # visages autorisés (empreintes + vignettes)
    ports:
      - "127.0.0.1:${CAMERA_PREVIEW_PORT:-8089}:8089"   # flux annoté (debug)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          cpus: "4"
    depends_on:
      sentinel-mosquitto: { condition: service_started }
    networks: [sentinel-back, sentinel-vision]

  # --- grafana/ : supervision, lit la base avec un compte en lecture seule ------------
  # grafana-db-init (one-shot, à chaque `up`) crée/met à jour ce compte depuis .env,
  # y compris sur une base existante. Source de données et tableaux de bord provisionnés.
  grafana-db-init:
    image: sentinel-x/database:dev
    container_name: sentinel-grafana-db-init
    <<: *hardening
    restart: "no"
    user: postgres
    cap_drop: [ALL]
    read_only: true
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      GRAFANA_DB_USER: ${GRAFANA_DB_USER:?GRAFANA_DB_USER manquant dans .env}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?GRAFANA_DB_PASSWORD manquant dans .env (make grafana-secrets)}
    entrypoint: ["sh", "-c", 'exec psql -X -q -v user="$$GRAFANA_DB_USER" -v password="$$GRAFANA_DB_PASSWORD" -f /db-user.sql']
    volumes:
      - ./grafana/db-user.sql:/db-user.sql:ro
    healthcheck:
      disable: true
    depends_on:
      db: { condition: service_healthy }
    networks: [sentinel-data]

  grafana:
    image: grafana/grafana-oss:13.0.2
    container_name: sentinel-grafana
    <<: *hardening
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD manquant dans .env (make grafana-secrets)}
      GF_SECURITY_SECRET_KEY: ${GRAFANA_SECRET_KEY:?GRAFANA_SECRET_KEY manquant dans .env (make grafana-secrets)}
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"     # aucun téléchargement de plugin au démarrage
      GF_LOG_MODE: console
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000/}
      # Lus par grafana/provisioning/datasources/postgres.yml
      POSTGRES_DB: ${POSTGRES_DB}
      GRAFANA_DB_USER: ${GRAFANA_DB_USER}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_BIND_IP:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      grafana-db-init: { condition: service_completed_successfully }
    networks: [sentinel-data, sentinel-monitoring]

networks:
  sentinel-front:                # proxy <-> backend/frontend
    driver: bridge
  sentinel-back:                 # services <-> mosquitto
    driver: bridge
  sentinel-data:                 # services <-> base : aucun accès extérieur
    driver: bridge
    internal: true
  sentinel-vision:               # backend-api <-> API des visages du détecteur
    driver: bridge
    internal: true
  sentinel-monitoring:           # publication du port de Grafana (la base reste sur sentinel-data)
    driver: bridge

volumes:
  mosquitto-data: {}
  pg-data: {}                    # données de database (volume existant conservé)
  faces-data: {}                 # visages autorisés (données biométriques : jamais sauvegardées hors machine)
  grafana-data: {}               # base interne de Grafana (utilisateurs, préférences)
